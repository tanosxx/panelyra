[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "panelyra"
dynamic = ["version"]
description = "Turn an Android tablet into a second GNOME display over USB"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "TanosX"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment :: Gnome",
]

[project.scripts]
panelyra = "usbdisplay.__main__:main"
panelyra-gui = "usbdisplay.launcher:main"

[tool.setuptools.dynamic]
version = {attr = "usbdisplay.__version__"}

[tool.setuptools.packages.find]
include = ["usbdisplay*"]

[tool.setuptools.package-data]
usbdisplay = ["assets/*.svg", "assets/*.png"]
